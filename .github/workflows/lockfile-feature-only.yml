name: F6 - Gerar lockfile apenas na branch de trabalho
on:
  push:
    branches:
      - feat/f6-reproducible-build-browser-qa-2026-11-09

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter somente a branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: feat/f6-reproducible-build-browser-qa-2026-11-09
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar apenas o arquivo de dependencias travadas
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirmar unica modificacao possivel
        shell: bash
        run: |
          set -euo pipefail
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'No package lock changes'
            exit 0
          fi
          if [ "$(git diff --cached --name-only)" != "package-lock.json" ]; then
            echo 'Unexpected changes staged' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(f6): commit reproducible npm dependency lock"
          git push origin HEAD:refs/heads/feat/f6-reproducible-build-browser-qa-2026-11-09
