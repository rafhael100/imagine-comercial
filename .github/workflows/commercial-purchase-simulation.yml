name: Commercial private purchase simulation
on:
  pull_request:
    paths:
      - 'ops/review/purchase/**'
      - '.github/workflows/commercial-purchase-simulation.yml'
permissions:
  contents: read
jobs:
  purchase-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Build and prepare separate private simulation tree
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node scripts/verify-dist.mjs
          IMAGINE_PRIVATE_PURCHASE_PREVIEW=1 node ops/review/purchase/prepare-preview.mjs dist "$RUNNER_TEMP/comercial-purchase-review"
          node scripts/verify-dist.mjs
      - name: Browser test of all simulated purchase journeys
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/purchase-browser"
          "$RUNNER_TEMP/purchase-browser/bin/pip" install --disable-pip-version-check 'playwright==1.56.0'
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          "$RUNNER_TEMP/purchase-browser/bin/python" ops/review/purchase/test_purchase.py
