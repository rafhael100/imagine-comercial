name: Commercial private purchase simulation
on:
  pull_request:
    paths:
      - 'ops/review/purchase/**'
      - '.github/workflows/commercial-purchase-simulation.yml'
permissions:
  contents: read
jobs:
  purchase-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact simulation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use approved Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Build and prepare separate private simulation tree
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node scripts/verify-dist.mjs
          IMAGINE_PRIVATE_PURCHASE_PREVIEW=1 node ops/review/purchase/prepare-preview.mjs dist "$RUNNER_TEMP/comercial-purchase-review"
          node scripts/verify-dist.mjs
      - name: Browser test of all simulated purchase journeys
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/purchase-browser"
          "$RUNNER_TEMP/purchase-browser/bin/pip" install --disable-pip-version-check 'playwright==1.56.0'
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          "$RUNNER_TEMP/purchase-browser/bin/python" ops/review/purchase/test_purchase.py
      - name: Real HTTP browser journey from four built commercial CTAs
        env:
          IMAGINE_PRIVATE_PURCHASE_PREPARED_ROOT: ${{ runner.temp }}/comercial-purchase-review
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/purchase-browser/bin/python" ops/review/purchase/test_home_to_purchase_http.py
      - name: Protected preview 401 and four authenticated synthetic browser journeys
        env:
          IMAGINE_PRIVATE_PURCHASE_PREPARED_ROOT: ${{ runner.temp }}/comercial-purchase-review
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/purchase-browser/bin/python" ops/review/purchase/test_protected_staging_browser.py --ci-local
  official-portal-entrypoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_PORTAL_LOGIN_URL: 'https://portal.imaginecomunicacao.com.br/login'
      IMAGINE_PORTAL_CUSTOMER_PREVIEW: '1'
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Build official HTTPS Portal nav without publication
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node scripts/verify-dist.mjs
          node ops/review/purchase/test-portal-entrypoint.mjs dist source
      - name: Verify four private CTAs and untouched build
        run: |
          set -euo pipefail
          node ops/review/purchase/prepare-customer-portal.mjs dist "$RUNNER_TEMP/comercial-private"
          node ops/review/purchase/test-portal-entrypoint.mjs "$RUNNER_TEMP/comercial-private" private
          node scripts/verify-dist.mjs
          echo 'PASS official Portal do Cliente nav and four isolated CTAs; NO DEPLOY or real account.' >> "$GITHUB_STEP_SUMMARY"
