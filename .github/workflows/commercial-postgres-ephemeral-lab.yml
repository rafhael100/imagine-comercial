name: Imagine Comercial - PostgreSQL replay lab real e descartavel

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-ephemeral:
    name: Banco PostgreSQL real isolado para testes anti-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      IMAGINE_EPHEMERAL_PG_TEST: '1'
    steps:
      - name: Obter codigo sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configurar Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Executar teste de PostgreSQL local e temporario sem deploy
        run: bash scripts/test-postgres-ephemeral-ci.sh
