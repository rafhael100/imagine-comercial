name: Comercial F324 - selecao pre-cadastro e paridade Portal V5 (offline)
on:
  pull_request:
    paths:
      - 'src/lib/commercial-selection-preview.mjs'
      - 'src/lib/media-budget-calculator.mjs'
      - 'tests/commercial-selection-preview.test.mjs'
      - 'ops/review/purchase/test-portal-v5-financial-parity.mjs'
      - 'ops/review/purchase/test-portal-v5-full-selection-matrix.mjs'
      - 'src/lib/commercial-choice-preview.mjs'
      - 'ops/review/purchase/portal-choice-handoff-gate.mjs'
      - '.github/workflows/comercial-f324-portal-v5-parity.yml'
permissions:
  contents: read
jobs:
  estimate-and-pinned-portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Comercial PR HEAD without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: comercial
          persist-credentials: false
      - name: Checkout fixed Portal F422/V5 candidate (NO DEPLOY)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-portal
          ref: b90f6d8d30fe82509823e9eeee903446140857db
          path: portal
          persist-credentials: false
      - name: Use Node 22 and PHP 8.3+
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Assert PHP runtime is compatible
        run: php -r 'if(PHP_VERSION_ID < 80300) exit(1);'
      - name: Verify customer-free quotes and all rejected inputs
        run: node --test comercial/tests/commercial-selection-preview.test.mjs
      - name: Compare exact PHP Portal V5 server catalog with JS marketing estimate
        run: node comercial/ops/review/purchase/test-portal-v5-financial-parity.mjs portal
      - name: F347 verify all 48 public combinations against the pinned PHP catalog
        run: node comercial/ops/review/purchase/test-portal-v5-full-selection-matrix.mjs portal
      - name: No production authorization
        run: |
          echo 'F324 is pricing compatibility only; not a signed quote, payment or contract.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Portal candidate pinned at b90f6d8d30fe82509823e9eeee903446140857db.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO-MERGE / NO-DEPLOY / NO-CHARGE / NO-PII.' >> "$GITHUB_STEP_SUMMARY"
