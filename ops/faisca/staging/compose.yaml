# FAÍSCA R38 PRIVATE REVIEW ONLY / NO AUTO-DEPLOY.
# This file is separate from the existing Commercial F253 locked staging.
# Operator must supply an audited digest-pinned image and a private bcrypt file.
services:
  faisca-review:
    image: ${IMAGINE_FAISCA_NGINX_IMAGE:?Set an independently reviewed digest-pinned unprivileged Nginx image}
    restart: "no"
    ports:
      - "127.0.0.1:4337:8080"
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ${IMAGINE_FAISCA_STAGING_SITE_DIR:?Set the reviewed absolute site directory}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${IMAGINE_FAISCA_STAGING_HTPASSWD_PATH:?Set a private bcrypt htpasswd file}:/etc/nginx/auth/.htpasswd:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m
    environment:
      - TZ=UTC
