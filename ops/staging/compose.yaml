# IMAGINE COMERCIAL — PRIVATE STAGING ONLY (NO PRODUCTION DEPLOY)
# Run only after independent operator approval and verify-dist.mjs.
# The image must be an explicitly reviewed Nginx unprivileged image @sha256.
services:
  static-review:
    image: ${IMAGINE_STAGING_NGINX_IMAGE:?Set a reviewed, digest-pinned Nginx unprivileged image}
    restart: "no"
    ports:
      - "127.0.0.1:4321:8080"
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ../../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${IMAGINE_STAGING_HTPASSWD_PATH:?Set operator-owned, private bcrypt htpasswd file}:/etc/nginx/auth/.htpasswd:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m
    environment:
      - TZ=UTC
