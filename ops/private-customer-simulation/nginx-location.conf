# Include inside the existing private development server. Inherit its Basic Auth.
location ^~ /simulacao/compra/ {
    if ($imagine_preview = 0) { return 503; }
    auth_basic "Imagine Desenvolvimento";
    auth_basic_user_file /etc/nginx/dev.htpasswd;
    proxy_pass http://127.0.0.1:18085;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
    proxy_redirect off;
    client_max_body_size 16k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
